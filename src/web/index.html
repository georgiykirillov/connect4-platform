<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <main class="game">
        <header class="game-header">
            <h1>Connect <span>Four</span></h1>
            <p class="subtitle">Соедини четыре фишки в ряд и победи.</p>
        </header>

        <section class="game-panel">
            <div class="game-toolbar">
                <div>
                    <p class="label">ТЕКУЩИЙ СТАТУС</p>
                    <h2 id="status">Загрузка игры...</h2>
                </div>
                <button id="reset" class="reset-button" type="button">
                    Новая игра
                </button>
            </div>

            <div class="players">
                <div class="player">
                    <span class="player-dot player-one"></span>
                    <span>Игрок 1</span>
                </div>
                <div class="player">
                    <span class="player-dot player-two"></span>
                    <span>Игрок 2</span>
                </div>
            </div>

            <div id="board" class="board" aria-label="Игровое поле"></div>

            <p id="error" class="error" role="alert"></p>
            <p class="hint">Нажми на колонку, чтобы поставить фишку.</p>
        </section>
    </main>
</body>
</html>
